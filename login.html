```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ورود به سامانه پایش دانشگاه فرهنگیان تهران</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Tahoma, Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f4c81,
                #1976b9
            );

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login-box {

            width: 400px;

            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);

            text-align: center;

        }


        .university-logo {

            width: 110px;

            height: 110px;

            object-fit: contain;

            display: block;

            margin: 0 auto 15px;

        }


        h1 {

            font-size: 22px;

            color: #0f4c81;

            margin-bottom: 8px;

        }


        .subtitle {

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;

        }


        input {

            width: 100%;

            padding: 14px;

            margin: 8px 0;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            text-align: right;

        }


        input:focus {

            outline: none;

            border-color: #1976b9;

        }


        button {

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: none;

            border-radius: 10px;

            background: #0f4c81;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #1976b9;

        }


        .footer {

            margin-top: 25px;

            color: #999;

            font-size: 12px;

        }

    </style>

</head>


<body>


    <div class="login-box">


        <!-- لوگوی دانشگاه فرهنگیان تهران -->

        <img
            src="{{ url_for('static', filename='images/cfu-tehran-logo.png') }}"
            alt="لوگوی دانشگاه فرهنگیان تهران"
            class="university-logo"
        >


        <h1>
            سامانه پایش
        </h1>


        <div class="subtitle">
            دانشگاه فرهنگیان تهران
        </div>


      <form action="/" method="post">


            <input
                type="text"
                name="username"
                placeholder="نام کاربری"
                required
            >


            <input
                type="password"
                name="password"
                placeholder="رمز عبور"
                required
            >


            <button type="submit">
                ورود به سامانه
            </button>


        </form>


        <div class="footer">
            سامانه ارزیابی و پایش دانشگاه فرهنگیان تهران
        </div>


    </div>


</body>

</html>
```
