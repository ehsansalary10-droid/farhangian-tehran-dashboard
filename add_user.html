<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>افزودن کاربر جدید</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: linear-gradient(
                135deg,
                #0d47a1,
                #1976d2
            );

            color: white;
            padding: 25px 40px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 25px;
        }

        .header p {
            margin: 0;
            opacity: 0.9;
        }

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-title {
            margin-top: 0;
            margin-bottom: 25px;
            color: #17365d;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6dce5;
            border-radius: 8px;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1976d2;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 14px;
        }

        .btn-save {
            background: #198754;
            color: white;
        }

        .btn-save:hover {
            background: #146c43;
        }

        .btn-back {
            background: #6c757d;
            color: white;
        }

        .btn-back:hover {
            background: #545b62;
        }

        .hint {
            margin-top: 8px;
            color: #777;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            margin: 30px 0;
            color: #777;
            font-size: 13px;
        }

    </style>

</head>


<body>


<header class="header">

    <h1>
        👤 افزودن کاربر جدید
    </h1>

    <p>
        ایجاد حساب کاربری برای سامانه پایش دانشگاه فرهنگیان تهران
    </p>

</header>


<div class="container">


    <div class="card">

        <h2 class="form-title">
            اطلاعات کاربر
        </h2>


        <form
            action="/add_user"
            method="post"
        >


            <div class="form-group">

                <label>
                    نام کاربری
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    autocomplete="off"
                >

                <div class="hint">
                    نامی که کاربر با آن وارد سامانه می‌شود.
                </div>

            </div>


            <div class="form-group">

                <label>
                    رمز عبور
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    نام و نام خانوادگی
                </label>

                <input
                    type="text"
                    name="full_name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    سمت
                </label>

                <input
                    type="text"
                    name="position"
                    placeholder="مثلاً رئیس دانشگاه"
                >

            </div>


            <div class="form-group">

                <label>
                    نقش کاربر
                </label>

                <select
                    name="role"
                    required
                >

                    <option value="user">
                        کاربر عادی
                    </option>

                    <option value="manager">
                        مدیر واحد
                    </option>

                    <option value="deputy">
                        معاونت
                    </option>

                    <option value="president">
                        رئیس دانشگاه
                    </option>

                    <option value="admin">
                        مدیر سامانه
                    </option>

                </select>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="btn btn-save"
                >
                    💾 ذخیره کاربر
                </button>


                <a
                    href="/manage_users"
                    class="btn btn-back"
                >
                    بازگشت
                </a>

            </div>


        </form>

    </div>


    <div class="footer">

        سامانه ارزیابی و پایش دانشگاه فرهنگیان تهران

    </div>


</div>


</body>

</html>
